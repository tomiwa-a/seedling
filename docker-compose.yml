services:
  ## Generate test data for a Postgres database
  ## Usage: docker compose up seed-pg
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5

  seed-pg:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - ./output:/output
    command: >
      generate
        --count 5000
        --db postgres://postgres:postgres@pg:5432/testdb?sslmode=disable
        --verbose

  ## Or generate to a SQL file
  seed-file:
    build: .
    volumes:
      - ./output:/output
    command: >
      generate
        --schema /schema.yaml
        --count 10000
        --output /output/seed.sql
        --verbose

  ## Introspect a database
  introspect:
    build: .
    depends_on:
      pg:
        condition: service_healthy
    volumes:
      - ./output:/output
    command: >
      introspect
        --db postgres://postgres:postgres@pg:5432/testdb?sslmode=disable
        --output /output/schema.yaml
